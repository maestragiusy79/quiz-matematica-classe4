<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheda 2 - Italiano classe seconda</title><link rel="stylesheet" href="../../../css/stile.css">
<style>body{background:#f7f9fc}.q{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin:18px 0}.match{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:center}.pic{font-size:2.5rem;text-align:center}.opts{display:grid;gap:8px}.opts label{padding:10px;border:1px solid var(--border);border-radius:12px}@media(max-width:650px){.match{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><section class="hero"><h1>📝 Scheda 2 · Frasi</h1><p>Italiano · Classe seconda</p></section><section class="card"><label>Nome<input id="nome"></label><label>Cognome<input id="cognome"></label></section>
<section class="q"><h2>1. Collega ogni frase al disegno corretto.</h2>
<div class="match"><p>Il gatto nero gioca con una pallina rossa.</p><select id="m1"><option></option><option value="gatto">🐱 Gatto</option><option value="aquilone">🪁 Aquilone</option><option value="lumache">🐌🐌 Lumache</option></select>
<p>Un aquilone giallo vola nel cielo azzurro.</p><select id="m2"><option></option><option value="gatto">🐱 Gatto</option><option value="aquilone">🪁 Aquilone</option><option value="lumache">🐌🐌 Lumache</option></select>
<p>Due lumache marroni mangiano l'insalata verde.</p><select id="m3"><option></option><option value="gatto">🐱 Gatto</option><option value="aquilone">🪁 Aquilone</option><option value="lumache">🐌🐌 Lumache</option></select></div></section>
<section class="q"><h2>2. Indica la frase che ha significato.</h2>
<div class="opts"><label><input type="radio" name="g1" value="a"> Il formaggio rosicchia il topo.</label><label><input type="radio" name="g1" value="b"> Il rosicchia formaggio il topo.</label><label><input type="radio" name="g1" value="c"> Il topo rosicchia il formaggio.</label></div>
<div class="opts" style="margin-top:14px"><label><input type="radio" name="g2" value="a"> Sara scrive con una matita.</label><label><input type="radio" name="g2" value="b"> Una matita scrive con Sara.</label><label><input type="radio" name="g2" value="c"> Una Sara scrive con matita.</label></div></section>
<div class="card"><button id="send" class="primary-btn">Consegna</button> <span id="msg"></span></div><p><a href="../">← Torna alle prove di italiano</a></p></main>
<script>
(function(){const radio=n=>document.querySelector('input[name="'+n+'"]:checked')?.value||'';document.getElementById('send').onclick=function(){const nome=document.getElementById('nome').value.trim(),cognome=document.getElementById('cognome').value.trim();if(!nome||!cognome){document.getElementById('msg').textContent='Inserisci nome e cognome.';return}let score=0,total=5;score+=document.getElementById('m1').value==='gatto';score+=document.getElementById('m2').value==='aquilone';score+=document.getElementById('m3').value==='lumache';score+=radio('g1')==='c';score+=radio('g2')==='a';const key='italiano2_scheda2_v1',a=JSON.parse(localStorage.getItem(key)||'[]');a.push({id:Date.now(),nome,cognome,createdAt:new Date().toISOString(),score,total});localStorage.setItem(key,JSON.stringify(a));document.getElementById('msg').textContent='Scheda consegnata ✓';document.querySelectorAll('input,select,button').forEach(x=>x.disabled=true);};})();
</script></body></html>
