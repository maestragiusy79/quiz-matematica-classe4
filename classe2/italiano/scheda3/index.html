<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheda 3 - Italiano classe seconda</title><link rel="stylesheet" href="../../../css/stile.css">
<style>body{background:#f7f9fc}.q{background:#fff;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid var(--border);border-radius:14px;padding:12px}.item span{font-size:2rem;display:block}.grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:700px){.grid,.grid2{grid-template-columns:1fr 1fr}}</style></head>
<body><main class="wrap"><section class="hero"><h1>🔤 Scheda 3 · Suoni simili</h1><p>Italiano · Classe seconda</p></section><section class="card"><label>Nome<input id="nome"></label><label>Cognome<input id="cognome"></label></section>
<section class="q"><h2>1. Completa le parole scegliendo tra d/t, b/p, f/v, s/z.</h2><div class="grid">
<label class="item"><span>🕯️</span><input class="word" data-answer="candela" placeholder="Scrivi la parola"></label><label class="item"><span>🏠</span><input class="word" data-answer="tetto" placeholder="Scrivi la parola"></label><label class="item"><span>🚩</span><input class="word" data-answer="bandiera" placeholder="Scrivi la parola"></label><label class="item"><span>🫑</span><input class="word" data-answer="peperone" placeholder="Scrivi la parola"></label><label class="item"><span>🩰</span><input class="word" data-answer="ballerina" placeholder="Scrivi la parola"></label><label class="item"><span>🍾</span><input class="word" data-answer="bottiglia" placeholder="Scrivi la parola"></label><label class="item"><span>☁️</span><input class="word" data-answer="nuvola" placeholder="Scrivi la parola"></label><label class="item"><span>🪟</span><input class="word" data-answer="finestra" placeholder="Scrivi la parola"></label><label class="item"><span>🎻</span><input class="word" data-answer="violino" placeholder="Scrivi la parola"></label><label class="item"><span>🦓</span><input class="word" data-answer="zebra" placeholder="Scrivi la parola"></label><label class="item"><span>🌻</span><input class="word" data-answer="girasole" placeholder="Scrivi la parola"></label><label class="item"><span>🎃</span><input class="word" data-answer="zucca" placeholder="Scrivi la parola"></label>
</div></section>
<section class="q"><h2>2. Osserva i disegni e scrivi le parole che contengono i gruppi mb o mp.</h2><div class="grid2">
<label class="item"><span>💡</span><input class="mbmp" data-answer="lampadina" placeholder="Scrivi la parola"></label><label class="item"><span>🥁</span><input class="mbmp" data-answer="tamburo" placeholder="Scrivi la parola"></label><label class="item"><span>☂️</span><input class="mbmp" data-answer="ombrello" placeholder="Scrivi la parola"></label><label class="item"><span>🔔</span><input class="mbmp" data-answer="campana" placeholder="Scrivi la parola"></label><label class="item"><span>🍩</span><input class="mbmp" data-answer="ciambella" placeholder="Scrivi la parola"></label><label class="item"><span>🎺</span><input class="mbmp" data-answer="tromba" placeholder="Scrivi la parola"></label><label class="item"><span>🦵</span><input class="mbmp" data-answer="gamba" placeholder="Scrivi la parola"></label><label class="item"><span>🧑‍🚒</span><input class="mbmp" data-answer="pompiere" placeholder="Scrivi la parola"></label>
</div></section>
<div class="card"><button id="send" class="primary-btn">Consegna</button> <span id="msg"></span></div><p><a href="../">← Torna alle prove di italiano</a></p></main>
<script>
(function(){const norm=s=>String(s||'').toLowerCase().trim();document.getElementById('send').onclick=function(){const nome=document.getElementById('nome').value.trim(),cognome=document.getElementById('cognome').value.trim();if(!nome||!cognome){document.getElementById('msg').textContent='Inserisci nome e cognome.';return}let score=0;const all=[...document.querySelectorAll('.word,.mbmp')];all.forEach(x=>{if(norm(x.value)===x.dataset.answer)score++});const key='italiano2_scheda3_v1',a=JSON.parse(localStorage.getItem(key)||'[]');a.push({id:Date.now(),nome,cognome,createdAt:new Date().toISOString(),score,total:all.length});localStorage.setItem(key,JSON.stringify(a));document.getElementById('msg').textContent='Scheda consegnata ✓';document.querySelectorAll('input,button').forEach(x=>x.disabled=true);};})();
</script></body></html>
